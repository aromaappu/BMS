<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMS</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- PIN Screen -->
<div id="pinScreen" class="pin-screen" style="display:none">
  <div class="pin-card">
    <div class="pin-logo">🔒</div>
    <h2>Enter PIN</h2>
    <div class="pin-display" id="pinDisplay">••••</div>
    <div class="pin-pad">
      <button onclick="pinInput('1')">1</button>
      <button onclick="pinInput('2')">2</button>
      <button onclick="pinInput('3')">3</button>
      <button onclick="pinInput('4')">4</button>
      <button onclick="pinInput('5')">5</button>
      <button onclick="pinInput('6')">6</button>
      <button onclick="pinInput('7')">7</button>
      <button onclick="pinInput('8')">8</button>
      <button onclick="pinInput('9')">9</button>
      <button onclick="pinClear()">C</button>
      <button onclick="pinInput('0')">0</button>
      <button onclick="pinSubmit()">✓</button>
    </div>
    <div id="pinError" class="error-msg"></div>
  </div>
</div>

<!-- Main App -->
<div id="mainApp" class="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-icon">🏢</span>
      <span class="brand-text">BMS</span>
    </div>
    <nav class="nav">
      <a href="#" data-page="dashboard" class="nav-link active"><span class="nav-icon">📊</span><span>Dashboard</span></a>
      <a href="#" data-page="customers" class="nav-link"><span class="nav-icon">👥</span><span>Customers</span></a>
      <a href="#" data-page="products" class="nav-link"><span class="nav-icon">📦</span><span>Products</span></a>
      <a href="#" data-page="billing" class="nav-link"><span class="nav-icon">🧾</span><span>Billing</span></a>
      <a href="#" data-page="credits" class="nav-link"><span class="nav-icon">💳</span><span>Credits</span></a>
      <a href="#" data-page="reports" class="nav-link"><span class="nav-icon">📈</span><span>Reports</span></a>
      <a href="#" data-page="analytics" class="nav-link"><span class="nav-icon">📉</span><span>Analytics</span></a>
      <a href="#" data-page="settings" class="nav-link"><span class="nav-icon">⚙️</span><span>Settings</span></a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-danger btn-block" onclick="logout()">🚪 Logout</button>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <h2 id="pageTitle">Dashboard</h2>
      <div class="topbar-right">
        <div class="notif-wrap">
          <button class="bell-btn" onclick="toggleNotif()">🔔<span class="badge" id="notifBadge">0</span></button>
          <div class="notif-dropdown" id="notifDropdown"></div>
        </div>
        <div class="user-info">👤 <span id="userName">Admin</span></div>
      </div>
    </header>
    <div class="page" id="pageContent"></div>
  </main>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle">Modal</h3>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/pages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
