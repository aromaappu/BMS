name: Code quality checks

on:
  push:
    branches: [main, improve/professional-ui-and-charts]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: |
          for file in public/js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
